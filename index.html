<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل أسعار الأصناف والمستلزمات - مكتب الريان</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root { --primary: #0f766e; --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: var(--primary); margin-top: 0; font-size: 1.4rem; }
        .stats { text-align: center; font-size: 0.95rem; color: #0f766e; font-weight: bold; margin-bottom: 20px; background: #f0fdfa; padding: 8px; border-radius: 8px; }
        
        .search-wrapper { position: relative; margin-bottom: 20px; }
        .search-input { width: 100%; padding: 15px 20px; font-size: 1.05rem; border: 2px solid #cbd5e1; border-radius: 12px; outline: none; transition: 0.2s; background: #f8fafc; }
        .search-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1); }
        .clear-btn { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); background: #e2e8f0; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: none; font-weight: bold; color: #475569; }

        .suggestions { position: absolute; top: 100%; right: 0; left: 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; max-height: 300px; overflow-y: auto; z-index: 100; box-shadow: 0 10px 20px rgba(0,0,0,0.1); margin-top: 5px; display: none; }
        .suggestion-item { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .suggestion-item:hover { background-color: #f0fdfa; }
        .suggestion-name { font-weight: 600; color: #0f172a; font-size: 0.95rem; }
        .suggestion-badge { font-size: 0.8rem; background: #e2e8f0; padding: 4px 8px; border-radius: 6px; color: #334155; white-space: nowrap; margin-right: 8px; }

        .result-card { background: linear-gradient(135deg, #0f766e, #0d9488); color: white; padding: 20px; border-radius: 14px; display: none; margin-top: 15px; box-shadow: 0 8px 16px rgba(15, 118, 110, 0.2); }
        .item-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 16px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 12px; }
        .prices-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: center; }
        .price-box { background: rgba(255,255,255,0.15); padding: 10px; border-radius: 10px; }
        .price-label { font-size: 0.8rem; opacity: 0.9; margin-bottom: 5px; display: block; }
        .price-value { font-size: 1.25rem; font-weight: bold; }

        .upload-section { margin-top: 25px; padding-top: 20px; border-top: 1px dashed #cbd5e1; text-align: center; }
        .upload-label, .copy-btn { display: inline-block; background: #f8fafc; border: 1px solid #94a3b8; color: #334155; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; margin: 5px; font-weight: 600; }
        .copy-btn { background: #0f766e; color: white; border: none; display: none; }
        #pdfUpload { display: none; }
        #statusMsg { font-size: 0.85rem; color: var(--primary); margin-top: 10px; font-weight: 600; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 الاستعلام السريع عن أسعار الأصناف</h1>
    <div class="stats" id="itemCount">جاري تحميل الأصناف...</div>

    <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="اكتب اسم الصنف هنا (مثال: ايفا، بامبرز، فاتيكا...)" autocomplete="off">
        <button class="clear-btn" id="clearBtn">✕</button>
        <div class="suggestions" id="suggestionsBox"></div>
    </div>

    <div class="result-card" id="resultCard">
        <div class="item-title" id="resName">اسم الصنف</div>
        <div class="prices-grid">
            <div class="price-box">
                <span class="price-label">سعر الصيدلي</span>
                <span class="price-value" id="resPharm">0.00</span> <small>ج</small>
            </div>
            <div class="price-box">
                <span class="price-label">سعر الجمهور</span>
                <span class="price-value" id="resPub">0.00</span> <small>ج</small>
            </div>
            <div class="price-box">
                <span class="price-label">الربح</span>
                <span class="price-value" id="resProfit">0.00</span> <small>ج</small>
            </div>
        </div>
    </div>

    <div class="upload-section">
        <label for="pdfUpload" class="upload-label">📄 اضغط هنا لاختيار ملف الـ PDF وإضافة الـ 2500 صنف</label>
        <input type="file" id="pdfUpload" accept="application/pdf">
        <br>
        <button id="copyJsonBtn" class="copy-btn">📋 نسخ كود الأصناف الكامل لوضعه في GitHub</button>
        <div id="statusMsg"></div>
    </div>
</div>

<script>
// القائمة المبدئية (تستبدل تلقائياً عند رفع الملف)
const initialProducts = [
    { name: "ماكياج كريم اساس بخاخ كيكو", pharm: 125.00, pub: 175 },
    { name: "اكتف مان فوم", pharm: 39.75, pub: 50 },
    { name: "ابره بزور", pharm: 3.50, pub: 10 },
    { name: "اختبار تحليل مخدرات رباعي", pharm: 32.86, pub: 50 },
    { name: "اختبار حمل بيبي تشيك بلاس", pharm: 5.90, pub: 15 }
];

let products = JSON.parse(localStorage.getItem('pharmacy_products')) || initialProducts;

const searchInput = document.getElementById('searchInput');
const suggestionsBox = document.getElementById('suggestionsBox');
const resultCard = document.getElementById('resultCard');
const clearBtn = document.getElementById('clearBtn');
const itemCount = document.getElementById('itemCount');
const copyJsonBtn = document.getElementById('copyJsonBtn');

function updateCounter() {
    itemCount.textContent = `إجمالي الأصناف المسجلة حالياً: ${products.length} صنف`;
}
updateCounter();

// تحويل الأرقام الهندية إلى أرقام عادية
function toEnglishDigits(str) {
    if (!str) return "";
    const eastern = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
    let res = str.toString();
    eastern.forEach((d, i) => { res = res.replace(new RegExp(d, 'g'), i); });
    return res.replace(/٫/g, '.');
}

function normalizeArabic(text) {
    return toEnglishDigits(text)
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/[ىئ]/g, 'ي')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
}

searchInput.addEventListener('input', function() {
    const query = normalizeArabic(this.value);
    suggestionsBox.innerHTML = '';
    
    if (this.value.length > 0) {
        clearBtn.style.display = 'block';
    } else {
        clearBtn.style.display = 'none';
        suggestionsBox.style.display = 'none';
        return;
    }

    const words = query.split(' ').filter(w => w.length > 0);
    const matches = products.filter(p => {
        const normName = normalizeArabic(p.name);
        return words.every(w => normName.includes(w));
    }).slice(0, 40);

    if (matches.length > 0) {
        matches.forEach(item => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.innerHTML = `
                <span class="suggestion-name">${item.name}</span>
                <span class="suggestion-badge">جمهور: ${item.pub} ج</span>
            `;
            div.addEventListener('click', () => selectProduct(item));
            suggestionsBox.appendChild(div);
        });
        suggestionsBox.style.display = 'block';
    } else {
        suggestionsBox.innerHTML = '<div class="suggestion-item">لا توجد نتائج مطابقة</div>';
        suggestionsBox.style.display = 'block';
    }
});

function selectProduct(item) {
    searchInput.value = item.name;
    suggestionsBox.style.display = 'none';
    document.getElementById('resName').textContent = item.name;
    document.getElementById('resPharm').textContent = Number(item.pharm).toFixed(2);
    document.getElementById('resPub').textContent = Number(item.pub).toFixed(2);
    document.getElementById('resProfit').textContent = (Number(item.pub) - Number(item.pharm)).toFixed(2);
    resultCard.style.display = 'block';
}

clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    suggestionsBox.style.display = 'none';
    resultCard.style.display = 'none';
    searchInput.focus();
});

document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrapper')) suggestionsBox.style.display = 'none';
});

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

document.getElementById('pdfUpload').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const statusMsg = document.getElementById('statusMsg');
    statusMsg.textContent = '⏳ جاري قراءة الـ 28 صفحة واستخراج كافة الأصناف...';

    try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let extracted = [];

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const textContent = await page.getTextContent();
            
            // تقسيم الصفحة إلى عمودين (يمين ويسار) كما في ملف مكتب الريان
            const midX = page.view[2] / 2;
            let rightCol = {}, leftCol = {};

            textContent.items.forEach(item => {
                const str = item.str.trim();
                if (!str) return;
                const x = item.transform[4];
                const y = Math.round(item.transform[5] / 5) * 5;
                const targetCol = x >= midX ? rightCol : leftCol;
                if (!targetCol[y]) targetCol[y] = [];
                targetCol[y].push({ x, text: str });
            });

            [rightCol, leftCol].forEach(col => {
                Object.values(col).forEach(row => {
                    // ترتيب النص وتنظيفه
                    const line = toEnglishDigits(row.map(r => r.text).join(' ')).replace(/\|/g, ' ').replace(/\s+/g, ' ').trim();
                    
                    // البحث عن رقمين عشريين/صحيحين واسم الصنف في نفس السطر
                    const nums = line.match(/\b\d+(?:\.\d+)?\b/g);
                    const arabicText = line.replace(/\b\d+\.\d{2}\b/g, '').replace(/^\d+(?:\.\d+)?\s*/, '').trim();

                    if (nums && nums.length >= 2 && arabicText.length > 2) {
                        // في قائمة الريان: السعر العشري هو الصيدلي، والآخر هو الجمهور
                        const decMatch = line.match(/\b(\d+\.\d{2})\b/);
                        if (decMatch) {
                            const pharmPrice = parseFloat(decMatch[1]);
                            const otherNums = nums.map(Number).filter(n => n !== pharmPrice);
                            const pubPrice = otherNums.length > 0 ? otherNums[0] : pharmPrice;
                            
                            // تنظيف اسم الصنف من السعرين في البداية أو النهاية
                            let cleanName = line
                                .replace(decMatch[1], '')
                                .replace(new RegExp(`^\\s*${pubPrice}\\s*|\\s*${pubPrice}\\s*$`), '')
                                .trim();

                            if (cleanName.length > 2 && !cleanName.includes('المستهلك') && !cleanName.includes('اورجا سوفت') && !cleanName.includes('مكتب الريان')) {
                                extracted.push({ name: cleanName, pharm: pharmPrice, pub: pubPrice });
                            }
                        }
                    }
                });
            });
        }

        if (extracted.length > 0) {
            const map = new Map();
            extracted.forEach(item => map.set(item.name, item));
            products = Array.from(map.values());
            localStorage.setItem('pharmacy_products', JSON.stringify(products));
            updateCounter();
            statusMsg.textContent = `✅ ممتاز! تم استخراج وحفظ ${products.length} صنف بالكامل في متصفحك!`;
            copyJsonBtn.style.display = 'inline-block';
        } else {
            statusMsg.textContent = '⚠️ لم يتم العثور على أصناف، تأكد من رفع ملف PDF الصحيح.';
        }
    } catch (err) {
        statusMsg.textContent = '❌ حدث خطأ أثناء قراءة الملف.';
        console.error(err);
    }
});

// زر لنسخ كل الأصناف إذا أردت تثبيتها داخل الكود على جيت هاب للأبد
copyJsonBtn.addEventListener('click', () => {
    const codeToPaste = `const initialProducts = ${JSON.stringify(products)};`;
    navigator.clipboard.writeText(codeToPaste).then(() => {
        alert('تم نسخ كافة الأصناف! يمكنك الآن فتح ملف index.html على GitHub واستبدال سطر const initialProducts بهذا الكود المحفوظ ليصبح الموقع شاملاً للـ 2500 صنف على أي جهاز في العالم.');
    });
});
</script>

</body>
</html>
