            --primary: #0f766e;
            --primary-light: #14b8a6;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: var(--primary); margin-top: 0; font-size: 1.5rem; }
        .stats { text-align: center; font-size: 0.9rem; color: #64748b; margin-bottom: 20px; }
        
        /* مربع البحث */
        .search-wrapper { position: relative; margin-bottom: 20px; }
        .search-input {
            width: 100%; padding: 15px 20px; font-size: 1.1rem;
            border: 2px solid #cbd5e1; border-radius: 12px; outline: none;
            transition: 0.2s; background: #f8fafc;
        }
        .search-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1); }
        .clear-btn {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            background: #e2e8f0; border: none; width: 28px; height: 28px;
            border-radius: 50%; cursor: pointer; display: none; font-weight: bold; color: #475569;
        }

        /* القائمة المتوقعة (Autocomplete) */
        .suggestions {
            position: absolute; top: 100%; right: 0; left: 0; background: #fff;
            border: 1px solid #cbd5e1; border-radius: 12px; max-height: 300px;
            overflow-y: auto; z-index: 100; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-top: 5px; display: none;
        }
        .suggestion-item {
            padding: 12px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; transition: 0.15s;
        }
        .suggestion-item:hover { background-color: #f0fdfa; }
        .suggestion-name { font-weight: 600; color: #0f172a; }
        .suggestion-badge { font-size: 0.85rem; background: #e2e8f0; padding: 3px 8px; border-radius: 6px; color: #334155; }

        /* بطاقة عرض السعر */
        .result-card {
            background: linear-gradient(135deg, #0f766e, #0d9488); color: white;
            padding: 22px; border-radius: 14px; display: none; margin-top: 15px;
            box-shadow: 0 8px 16px rgba(15, 118, 110, 0.2); animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .item-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 18px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 12px; }
        .prices-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; text-align: center; }
        .price-box { background: rgba(255,255,255,0.15); padding: 12px; border-radius: 10px; backdrop-filter: blur(5px); }
        .price-label { font-size: 0.85rem; opacity: 0.9; margin-bottom: 6px; display: block; }
        .price-value { font-size: 1.35rem; font-weight: bold; }

        .upload-section {

const searchInput = document.getElementById('searchInput');
const suggestionsBox = document.getElementById('suggestionsBox');
const resultCard = document.getElementById('resultCard');
const clearBtn = document.getElementById('clearBtn');
const itemCount = document.getElementById('itemCount');

}

// دالة توحيد الحروف العربية والأرقام لتسهيل البحث
function normalizeArabic(text) {
    if (!text) return "";
    const easternDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
    let res = text.toString();
    easternDigits.forEach((d, i) => { res = res.replace(new RegExp(d, 'g'), i); });
    return res
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .replace(/ئ/g, 'ي')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
}

// البحث وإظهار التوقعات
searchInput.addEventListener('input', function() {
    const query = normalizeArabic(this.value);
    suggestionsBox.innerHTML = '';
    
    if (this.value.length > 0) {
        clearBtn.style.display = 'block';
    } else {
        clearBtn.style.display = 'none';
        suggestionsBox.style.display = 'none';
        return;
    }

    const words = query.split(' ').filter(w => w.length > 0);
    const matches = products.filter(p => {
        const normName = normalizeArabic(p.name);
        return words.every(w => normName.includes(w));
    }).slice(0, 30); // إظهار أول 30 نتيجة متطابقة للسرعة

    if (matches.length > 0) {
        matches.forEach(item => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.innerHTML = `
                <span class="suggestion-name">${item.name}</span>
                <span class="suggestion-badge">جمهور: ${item.pub} ج</span>
            `;
            div.addEventListener('click', () => selectProduct(item));
            suggestionsBox.appendChild(div);
        });
        suggestionsBox.style.display = 'block';
    } else {
        suggestionsBox.innerHTML = '<div class="suggestion-item">لا توجد نتائج مطابقة</div>';
        suggestionsBox.style.display = 'block';
    }
});

// عرض تفاصيل الصنف عند الضغط عليه
function selectProduct(item) {
    searchInput.value = item.name;
    suggestionsBox.style.display = 'none';
    
    document.getElementById('resName').textContent = item.name;
    document.getElementById('resPharm').textContent = Number(item.pharm).toFixed(2);
    document.getElementById('resPub').textContent = Number(item.pub).toFixed(2);
    
    const profit = (Number(item.pub) - Number(item.pharm)).toFixed(2);
    document.getElementById('resProfit').textContent = profit;
    
    resultCard.style.display = 'block';
}

clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    suggestionsBox.style.display = 'none';
    resultCard.style.display = 'none';
    searchInput.focus();
});

// إخفاء القائمة عند الضغط خارجها
document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrapper')) {
        suggestionsBox.style.display = 'none';
    }
});

// ميزة استخراج كافة الأصناف من ملف الـ PDF مباشرة في المتصفح
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

document.getElementById('pdfUpload').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const statusMsg = document.getElementById('statusMsg');
    statusMsg.textContent = '⏳ جاري قراءة جميع صفحات الملف واستخراج الأسعار...';

    try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let extracted = [];

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const textContent = await page.getTextContent();
            
            // تجميع العناصر حسب السطر (الإحداثي Y)
            let rows = {};
            textContent.items.forEach(item => {
                const y = Math.round(item.transform[5] / 4) * 4;
                if (!rows[y]) rows[y] = [];
                rows[y].push({ x: item.transform[4], text: item.str.trim() });
            });

            Object.values(rows).forEach(rowItems => {
                // ترتيب العناصر من اليمين لليسار أو حسب الظهور
                rowItems.sort((a, b) => a.x - b.x);
                const fullLine = rowItems.map(i => i.text).join(' ');
                
                // استخراج الأنماط: (سعر المستهلك) (سعر الصيدلي) (اسم الصنف)
                const regex = /(\d+(?:\.\d+)?)\s+(\d+\.\d{2})\s+([^\d|]+?)(?=\s+\d+(?:\.\d+)?\s+\d+\.\d{2}|$)/g;
                let match;
                while ((match = regex.exec(fullLine)) !== null) {
                    const pubPrice = parseFloat(match[1]);
                    const pharmPrice = parseFloat(match[2]);
                    const prodName = match[3].trim();
                    if (prodName.length > 2 && !prodName.includes('المستهلك') && !prodName.includes('اورجا سوفت')) {
                        extracted.push({ name: prodName, pharm: pharmPrice, pub: pubPrice });
                    }
                }
            });
        }

        if (extracted.length > 0) {
            // دمج الأصناف المستخرجة مع إزالة التكرار
            const map = new Map();
            [...products, ...extracted].forEach(item => map.set(normalizeArabic(item.name), item));
            products = Array.from(map.values());
            localStorage.setItem('pharmacy_products', JSON.stringify(products));
            updateCounter();
            statusMsg.textContent = `✅ تم استخراج وحفظ ${products.length} صنف بنجاح من الـ ${pdf.numPages} صفحة!`;
        } else {
            statusMsg.textContent = '⚠️ تم فحص الملف، تأكد من اختيار ملف القائمة الأصلي.';
        }
    } catch (err) {
        statusMsg.textContent = '❌ حدث خطأ أثناء قراءة الملف.';
        console.error(err);
    }
});
</script>
